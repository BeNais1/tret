name: Tret
options:
  bundleIdPrefix: io.tret
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_UPCOMING_FEATURE_BARE_SLASH_REGEX_LITERALS: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_BITCODE: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.1.0"

targets:
  Tret:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tret
        excludes:
          - "Preview Content/**/*"
      - path: Tret/Preview Content
        buildPhase:
          copyFiles:
            destination: resources
        attributes:
          [ASSET_TAGS]
    resources:
      - path: Tret/Resources/Assets.xcassets
      - path: Tret/Resources/GoogleService-Info.plist
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tret.ios
        PRODUCT_NAME: Tret
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Tret/Resources/Info.plist
        DEVELOPMENT_ASSET_PATHS: '"Tret/Preview Content"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - package: Kingfisher
        product: Kingfisher

schemes:
  Tret:
    build:
      targets:
        Tret: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
